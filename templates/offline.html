<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0f">
  <title>RailSync — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0a0b0f;
      --card: #13151d;
      --accent: #6c63ff;
      --accent2: #a89cff;
      --border: rgba(255,255,255,0.08);
      --text: #e8eaf0;
      --muted: #8b8fa8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      animation: fadeIn .4s ease;
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      background: rgba(108,99,255,0.12);
      border: 1px solid rgba(108,99,255,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 34px;
      color: var(--accent2);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 26px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, background 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      background: rgba(239,68,68,0.12);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 20px;
      margin-bottom: 16px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <i class="fa-solid fa-wifi-slash"></i>
    </div>
    <div class="status-badge"><i class="fa-solid fa-circle-exclamation"></i> Offline Mode</div>
    <h1>Connection Lost</h1>
    <p>You seem to be travelling through a low-signal railway section. RailSync will automatically reconnect when network signal is restored.</p>
    <button class="btn" onclick="window.location.reload()">
      <i class="fa-solid fa-rotate-right"></i> Try Reconnecting
    </button>
  </div>
</body>
</html>
