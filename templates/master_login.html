<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Staff Login — RailSync HQ</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #08090e;
      --card: rgba(14, 15, 22, 0.7);
      --accent: #22c55e;
      --accent2: #4ade80;
      --accentDeep: #16a34a;
      --purple: #6c63ff;
      --purple2: #a89cff;
      --text: #e8eaf0;
      --muted: #8b8fa8;
      --border: rgba(255,255,255,0.08);
      --inputBg: rgba(255,255,255,0.04);
      --red: #ef4444;
      --amber: #f59e0b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    
    /* ===== ANIMATED MESH GRADIENT BG ===== */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0;
      background: 
        radial-gradient(ellipse 600px 600px at 15% 20%, rgba(34,197,94,0.18), transparent),
        radial-gradient(ellipse 500px 500px at 85% 80%, rgba(74,222,128,0.10), transparent),
        radial-gradient(ellipse 400px 400px at 50% 50%, rgba(108,99,255,0.06), transparent);
      animation: meshShift 12s ease-in-out infinite alternate;
    }
    @keyframes meshShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(15deg); }
    }

    /* Floating particles */
    .particle {
      position: fixed; border-radius: 50%; z-index: 0; pointer-events: none;
      background: var(--accent); opacity: 0;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Grid lines */
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
      background-size: 50px 50px; z-index: 0; pointer-events: none;
    }

    /* ===== GLASS CARD ===== */
    .card {
      width: 100%; max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 44px 40px;
      position: relative; z-index: 10;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(34,197,94,0.05);
      animation: portalIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0; transform: translateY(50px) scale(0.92);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34,197,94,0.5), transparent);
    }
    @keyframes portalIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .logo {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 24px; font-weight: 800; margin-bottom: 28px; letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accentDeep), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
      box-shadow: 0 6px 20px rgba(34,197,94,0.4);
      animation: logoGlow 3s ease-in-out infinite alternate;
    }
    @keyframes logoGlow {
      from { box-shadow: 0 6px 20px rgba(34,197,94,0.3); }
      to { box-shadow: 0 6px 30px rgba(34,197,94,0.6); }
    }
    
    h2 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 32px; }

    /* ROLE TABS */
    .role-tabs {
      position: relative;
      display: grid; grid-template-columns: 1fr 1fr;
      background: rgba(0,0,0,0.25); border-radius: 14px;
      margin-bottom: 28px; padding: 4px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .role-tab {
      padding: 11px; border-radius: 10px; cursor: pointer;
      background: transparent; color: var(--muted);
      font-family: inherit; font-size: 13px; font-weight: 600;
      border: none; transition: all 0.3s; position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .role-tab.active { color: #fff; }
    .tab-slider {
      position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
      background: rgba(34,197,94,0.2); border-radius: 10px;
      border: 1px solid rgba(34,197,94,0.25);
      box-shadow: 0 2px 12px rgba(34,197,94,0.15);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1;
    }

    .form-group { margin-bottom: 22px; position: relative; }
    label { 
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; color: var(--muted); 
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; 
    }
    label i { font-size: 12px; color: var(--accent); }
    input {
      width: 100%; padding: 13px 16px;
      background: var(--inputBg); 
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; color: #fff;
      font-family: inherit; font-size: 14px; outline: none;
      transition: all 0.3s;
    }
    input:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px rgba(34,197,94,0.12), 0 0 20px rgba(34,197,94,0.08); 
      background: rgba(34,197,94,0.04); 
    }
    input:hover {
      border-color: rgba(34,197,94,0.6);
      background: rgba(34,197,94,0.02);
    }
    input::placeholder { color: rgba(255,255,255,0.2); }
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
        transition: background-color 5000s ease-in-out 0s;
        -webkit-text-fill-color: #fff !important;
    }
    
    .pwd-wrap { position: relative; }
    .pwd-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 14px; transition: color 0.2s;
    }
    .pwd-toggle:hover { color: var(--accent2); }

    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accentDeep), var(--accent)); color: #fff;
      border: none; border-radius: 12px;
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: all 0.3s; 
      box-shadow: 0 8px 20px rgba(34,197,94,0.3);
      position: relative; overflow: hidden;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(34,197,94,0.45);
    }
    .btn-submit::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }
    .btn-submit:hover::after { left: 120%; }
    
    .footer-links { 
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      margin-top: 28px; 
    }
    .footer-links a { 
      font-size: 13px; color: var(--muted); text-decoration: none; 
      font-weight: 500; transition: color 0.2s; 
    }
    .footer-links a span { color: var(--accent2); font-weight: 600; }
    .footer-links a:hover { color: #fff; }
    .footer-links a:hover span { color: #fff; }

    .alert {
      padding: 12px 16px; border-radius: 12px;
      font-size: 13px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
      animation: alertIn 0.4s ease;
    }
    @keyframes alertIn { from { opacity: 0; transform: translateY(-10px); } }
    .alert-danger { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--red); }
    .alert-warning { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); color: var(--amber); }
    .alert-success { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); color: var(--accent); }
    .alert-info { background: rgba(108,99,255,0.08); border: 1px solid rgba(108,99,255,0.25); color: var(--purple2); }

    /* Stagger form fields */
    .stagger-1 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.3s; }
    .stagger-2 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.4s; }
    .stagger-3 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.5s; }
    @keyframes fieldIn { from { opacity: 0; transform: translateY(12px); } }
  </style>
</head>
<body>

<div class="bg-mesh"></div>

<!-- Floating particles -->
<div class="particle" style="width:3px;height:3px;left:12%;animation-duration:8s;animation-delay:0s;"></div>
<div class="particle" style="width:2px;height:2px;left:30%;animation-duration:12s;animation-delay:2s;"></div>
<div class="particle" style="width:4px;height:4px;left:60%;animation-duration:10s;animation-delay:4s;"></div>
<div class="particle" style="width:2px;height:2px;left:80%;animation-duration:9s;animation-delay:1s;"></div>
<div class="particle" style="width:3px;height:3px;left:92%;animation-duration:11s;animation-delay:3s;"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
    Railway HQ
  </div>
  <h2>Staff Portal</h2>
  <p class="sub">Authenticated access for railway personnel</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}"><i class="fa-solid fa-circle-exclamation"></i> {{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="role-tabs stagger-1">
    <div class="tab-slider" id="tab-slider"></div>
    <button type="button" class="role-tab active" id="tab-admin" onclick="setRole('admin')"><i class="fa-solid fa-user-tie"></i> Station Master</button>
    <button type="button" class="role-tab" id="tab-super" onclick="setRole('super_admin')"><i class="fa-solid fa-globe"></i> Super Admin</button>
  </div>

  <form method="POST" action="{{ url_for('auth.admin_login') }}" autocomplete="off">
    <input type="hidden" name="role" id="role-input" value="{{ request.args.get('role', 'admin') }}">
    
    <div class="form-group stagger-2">
      <label><i class="fa-solid fa-envelope"></i> Staff Email</label>
      <input type="email" name="email" placeholder="Staff Email" required autocomplete="off">
    </div>
    
    <div class="form-group stagger-2">
      <label><i class="fa-solid fa-lock"></i> Secure Passphrase</label>
      <div class="pwd-wrap">
        <input type="password" name="password" id="password-input" placeholder="Secure Passphrase" required autocomplete="new-password" style="padding-right:42px;">
        <button type="button" class="pwd-toggle" onclick="togglePassword()"><i class="fa-solid fa-eye" id="pwd-icon"></i></button>
      </div>
    </div>
    
    <div class="stagger-3">
      <button type="submit" class="btn-submit">Authenticate <i class="fa-solid fa-shield-check" style="margin-left:6px;"></i></button>
    </div>
  </form>

  <div class="footer-links">
    <a href="{{ url_for('auth.login') }}"><i class="fa-solid fa-arrow-left" style="font-size:11px;margin-right:4px;"></i> Back to <span>Passenger Portal</span></a>
  </div>
</div>

<script>
function setRole(role) {
  document.getElementById('role-input').value = role;
  const isAdmin = role === 'admin';
  
  document.getElementById('tab-admin').classList.toggle('active', isAdmin);
  document.getElementById('tab-super').classList.toggle('active', !isAdmin);
  document.getElementById('tab-slider').style.transform = isAdmin ? 'translateX(0)' : 'translateX(100%)';
  
  localStorage.setItem('railSyncMasterRole', role);
}

function togglePassword() {
  const pwd = document.getElementById('password-input');
  const icon = document.getElementById('pwd-icon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.className = 'fa-solid fa-eye-slash';
  } else {
    pwd.type = 'password';
    icon.className = 'fa-solid fa-eye';
  }
}

document.addEventListener('DOMContentLoaded', () => {
    let urlRole = new URLSearchParams(window.location.search).get('role');
    if (urlRole !== 'super_admin') urlRole = 'admin';
    setRole(urlRole);
});
</script>
</body>
</html>
