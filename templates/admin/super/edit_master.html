{% extends "base.html" %}
{% block title %}Edit Station Master{% endblock %}
{% block page_title %}Edit Station Master{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header">
    <div class="card-title">Update Details for {{ master.name }}</div>
    <a href="{{ url_for('admin.super_masters') }}" class="btn btn-ghost btn-sm">← Back</a>
  </div>
  
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">

      <label>Full Name</label>
      <input type="text" name="name" value="{{ master.name }}" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" value="{{ master.email }}" disabled style="opacity:0.6; cursor:not-allowed;">
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">Emails cannot be changed once registered.</div>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" name="phone" value="{{ master.phone }}" required>
    </div>
    <div class="form-group">
      <label>Assigned Station</label>
      <select name="station_id" required>
        {% for s in stations %}
        <option value="{{ s.station_id }}" {% if s.station_id == master.station_id %}selected{% endif %}>
          {{ s.station_name }} ({{ s.city }}, {{ s.state }})
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:10px;">
      <input type="checkbox" name="is_super_admin" id="is_super_admin" style="width:auto;" {% if master.is_super_admin %}checked{% endif %}>
      <label for="is_super_admin" style="margin:0;">Grant Super Admin Access (Railway HQ Level)</label>
    </div>
    
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:16px;">
      Save Changes
    </button>
  </form>
</div>
{% endblock %}
