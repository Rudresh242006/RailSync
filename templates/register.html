<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#08090e">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192x192.png">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Create Account — RailSync</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #08090e;
      --card: rgba(14, 15, 22, 0.7);
      --accent: #6c63ff;
      --accent2: #a89cff;
      --accentDeep: #5046e5;
      --green: #22c55e;
      --text: #e8eaf0;
      --muted: #8b8fa8;
      --border: rgba(255,255,255,0.08);
      --inputBg: rgba(255,255,255,0.04);
      --red: #ef4444;
      --amber: #f59e0b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow-x: hidden;
      padding: 30px 16px;
    }
    
    /* ===== ANIMATED MESH GRADIENT BG ===== */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0;
      background: 
        radial-gradient(ellipse 600px 600px at 15% 20%, rgba(108,99,255,0.20), transparent),
        radial-gradient(ellipse 500px 500px at 85% 80%, rgba(168,156,255,0.12), transparent),
        radial-gradient(ellipse 400px 400px at 50% 50%, rgba(34,197,94,0.06), transparent);
      animation: meshShift 12s ease-in-out infinite alternate;
    }
    @keyframes meshShift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(15deg); }
    }

    /* Floating particles */
    .particle {
      position: fixed; border-radius: 50%; z-index: 0; pointer-events: none;
      background: var(--accent); opacity: 0;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Grid lines */
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px; z-index: 0; pointer-events: none;
    }

    /* ===== GLASS CARD ===== */
    .card {
      width: 100%; max-width: 440px;
      background: var(--card);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 2px solid rgba(108,99,255,0.85);
      border-radius: 24px; padding: 44px 40px;
      position: relative; z-index: 10;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.6),
        0 0 0 4px rgba(108,99,255,0.15),
        0 0 60px rgba(108,99,255,0.25),
        0 0 120px rgba(108,99,255,0.10),
        inset 0 1px 0 rgba(255,255,255,0.12);
      animation: portalIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards, borderPulse 3s ease-in-out infinite alternate;
      opacity: 0; transform: translateY(50px) scale(0.92);
    }
    @keyframes borderPulse {
      from {
        box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 4px rgba(108,99,255,0.12), 0 0 40px rgba(108,99,255,0.18), 0 0 80px rgba(108,99,255,0.08), inset 0 1px 0 rgba(255,255,255,0.12);
        border-color: rgba(108,99,255,0.70);
      }
      to {
        box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 6px rgba(108,99,255,0.20), 0 0 80px rgba(108,99,255,0.35), 0 0 140px rgba(108,99,255,0.15), inset 0 1px 0 rgba(255,255,255,0.12);
        border-color: rgba(108,99,255,1);
      }
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(108,99,255,0.5), transparent);
    }
    @keyframes portalIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .logo {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 24px; font-weight: 800; margin-bottom: 28px; letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
      box-shadow: 0 6px 20px rgba(108,99,255,0.4);
      animation: logoGlow 3s ease-in-out infinite alternate;
    }
    @keyframes logoGlow {
      from { box-shadow: 0 6px 20px rgba(108,99,255,0.3); }
      to { box-shadow: 0 6px 30px rgba(108,99,255,0.6); }
    }
    
    h2 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 32px; }

    .form-group { margin-bottom: 20px; position: relative; }
    label { 
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; color: #c8cadb; 
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; 
    }
    label i { font-size: 12px; color: var(--accent); }
    input {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(108,99,255,0.55);
      border-radius: 12px; color: #fff;
      font-family: inherit; font-size: 14px; outline: none;
      transition: all 0.3s;
      box-shadow: 0 0 0 1px rgba(108,99,255,0.10) inset;
    }
    input:focus { 
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.20), 0 0 28px rgba(108,99,255,0.14);
      background: rgba(108,99,255,0.12);
    }
    input:hover {
      border-color: rgba(108,99,255,0.80);
      background: rgba(255,255,255,0.10);
    }
    input::placeholder { color: rgba(200,202,219,0.60); }
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
        transition: background-color 5000s ease-in-out 0s;
        -webkit-text-fill-color: #fff !important;
    }
    
    .pwd-wrap { position: relative; }
    .pwd-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 14px; transition: color 0.2s;
    }
    .pwd-toggle:hover { color: var(--accent2); }

    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accentDeep)); color: #fff;
      border: none; border-radius: 12px;
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      transition: all 0.3s; 
      box-shadow: 0 8px 20px rgba(108,99,255,0.3);
      position: relative; overflow: hidden;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(108,99,255,0.45);
    }
    .btn-submit::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }
    .btn-submit:hover::after { left: 120%; }
    
    .footer-links { 
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      margin-top: 28px; 
    }
    .footer-links a { 
      font-size: 13px; color: var(--muted); text-decoration: none; 
      font-weight: 500; transition: color 0.2s; 
    }
    .footer-links a span { color: var(--accent2); font-weight: 600; }
    .footer-links a:hover { color: #fff; }
    .footer-links a:hover span { color: #fff; }

    .alert {
      padding: 12px 16px; border-radius: 12px;
      font-size: 13px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 10px;
      animation: alertIn 0.4s ease;
    }
    @keyframes alertIn { from { opacity: 0; transform: translateY(-10px); } }
    .alert-danger { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: var(--red); }
    .alert-warning { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.25); color: var(--amber); }
    .alert-success { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .alert-info { background: rgba(108,99,255,0.08); border: 1px solid rgba(108,99,255,0.25); color: var(--accent2); }

    .home-btn {
      position: fixed; top: 24px; left: 24px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.04); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; font-size: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      animation: alertIn 0.8s ease backwards; animation-delay: 0.2s;
    }
    .home-btn:hover {
      background: rgba(255,255,255,0.1); color: #fff;
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2), 0 0 0 1px rgba(108,99,255,0.2);
    }

    /* Stagger form fields */
    .stagger-1 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.3s; }
    .stagger-2 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.4s; }
    .stagger-3 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.5s; }
    .stagger-4 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.6s; }
    .stagger-5 { animation: fieldIn 0.6s ease backwards; animation-delay: 0.7s; }
    @keyframes fieldIn { from { opacity: 0; transform: translateY(12px); } }
  </style>
</head>
<body>

<div class="bg-mesh"></div>
<a href="/" class="home-btn" title="Back to Home"><i class="fa-solid fa-house"></i></a>

<!-- Floating particles -->
<div class="particle" style="width:3px;height:3px;left:10%;animation-duration:8s;animation-delay:0s;"></div>
<div class="particle" style="width:2px;height:2px;left:25%;animation-duration:12s;animation-delay:2s;"></div>
<div class="particle" style="width:4px;height:4px;left:55%;animation-duration:10s;animation-delay:4s;"></div>
<div class="particle" style="width:2px;height:2px;left:75%;animation-duration:9s;animation-delay:1s;"></div>
<div class="particle" style="width:3px;height:3px;left:90%;animation-duration:11s;animation-delay:3s;"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-train-subway"></i></div>
    RailSync
  </div>
  <h2>Create Account</h2>
  <p class="sub">Join as a passenger — free forever</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}"><i class="fa-solid fa-circle-exclamation"></i> {{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.register') }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group stagger-1">
      <label><i class="fa-solid fa-user"></i> Full Name</label>
      <input type="text" name="name" placeholder="Full Name" required maxlength="100" autocomplete="name">
    </div>
    
    <div class="form-group stagger-2">
      <label><i class="fa-solid fa-envelope"></i> Email Address</label>
      <input type="email" name="email" placeholder="name@example.com" required maxlength="150" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="email">
    </div>
    
    <div class="form-group stagger-3">
      <label><i class="fa-solid fa-phone"></i> Phone Number</label>
      <input type="tel" name="phone" placeholder="10-digit mobile number" required maxlength="15" autocomplete="tel">
    </div>
    
    <div class="form-group stagger-4">
      <label><i class="fa-solid fa-lock"></i> Password</label>
      <div class="pwd-wrap">
        <input type="password" name="password" id="password-input" placeholder="Create a password (min 8 chars)" required minlength="8" autocomplete="new-password" style="padding-right:42px;">
        <button type="button" class="pwd-toggle" onclick="togglePassword()"><i class="fa-solid fa-eye" id="pwd-icon"></i></button>
      </div>
    </div>
    
    <div class="stagger-5">
      <button type="submit" class="btn-submit">Create Account <i class="fa-solid fa-arrow-right" style="margin-left:6px;"></i></button>
    </div>
  </form>

  <div class="footer-links">
    <a href="{{ url_for('auth.login') }}">Already have an account? <span>Sign in →</span></a>
  </div>
</div>

<script>
function togglePassword() {
  const pwd = document.getElementById('password-input');
  const icon = document.getElementById('pwd-icon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.className = 'fa-solid fa-eye-slash';
  } else {
    pwd.type = 'password';
    icon.className = 'fa-solid fa-eye';
  }
}
</script>
</body>
</html>
